<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>视频播放 - fnytdlp</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: rgba(20, 20, 20, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }
    .title {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 70vw;
    }
    .close-btn {
      padding: 6px 16px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .close-btn:hover { background: rgba(255, 255, 255, 0.2); }
    .video-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
    }
    video {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      outline: none;
    }
    .info {
      padding: 8px 20px;
      background: rgba(20, 20, 20, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      text-align: center;
      flex-shrink: 0;
    }
    .error {
      color: #ff6b6b;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title" id="title">▶ 加载中...</div>
    <button class="close-btn" onclick="window.close()">关闭</button>
  </div>
  <div class="video-wrap">
    <video id="video" controls autoplay playsinline preload="auto">
      您的浏览器不支持视频播放
    </video>
  </div>
  <div class="info" id="info">fnytdlp 视频播放器</div>
  <script>
    // 从 URL 拿 id
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    const title = params.get('title') || decodeURIComponent(params.get('t') || 'video');
    const gatewayBase = (location.pathname.split('/').slice(0, 3).join('/')) || '/app/fnytdlp';
    const titleEl = document.getElementById('title');
    const infoEl = document.getElementById('info');
    const video = document.getElementById('video');

    if (!id) {
      titleEl.textContent = '❌ 错误: 缺少任务 ID';
      document.querySelector('.video-wrap').innerHTML = '<div class="error">缺少任务 ID 参数</div>';
    } else {
      titleEl.textContent = '▶ ' + title;
      const src = gatewayBase + '/api/play/' + id;
      video.src = src;
      video.load();
      video.onerror = (e) => {
        const code = video.error?.code;
        const names = { 1: 'ABORTED', 2: 'NETWORK', 3: 'DECODE', 4: 'SRC_NOT_SUPPORTED' };
        titleEl.textContent = '❌ 播放失败';
        infoEl.textContent = `错误: ${names[code] || code} | URL: ${src}`;
        console.error('[player] video error', code, video.error);
      };
      video.onplay = () => { infoEl.textContent = '▶ 播放中 | ' + src; };
      video.onpause = () => { infoEl.textContent = '⏸ 暂停 | ' + src; };
    }
  </script>
</body>
</html>
